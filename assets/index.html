<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Podsjetnik za izlaganje – Slajdovi 17–23</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #141418;
      --surface-2: #1f1f27;
      --border: #2e2e3a;
      --text: #ffffff;
      --muted: #b4b4c4;
      --accent: #ffe600;
      --accent-bg: rgba(255, 230, 0, 0.16);
      --warn: #ff5c5c;
      --warn-bg: rgba(255, 92, 92, 0.18);
      --cyan: #5ceeff;
      --next-bg: #ffe600;
      --next-text: #000000;
      --kw-size: 30px;
      --full-size: 25px;

      --state-green-bg: #00c853;
      --state-green-fg: #000000;
      --state-yellow-bg: #ffe600;
      --state-yellow-fg: #000000;
      --state-red-bg: #ff2d20;
      --state-red-fg: #ffffff;
    }

    body.light {
      --bg: #ffffff;
      --surface: #f1f2f6;
      --surface-2: #e2e4ec;
      --border: #c5c8d6;
      --text: #000000;
      --muted: #45485a;
      --accent: #0047ff;
      --accent-bg: #fff275;
      --warn: #c40000;
      --warn-bg: #ffd6d6;
      --cyan: #005b96;
      --next-bg: #000000;
      --next-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* TOP BAR */
    .topbar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .mode-switch {
      display: flex;
      background: var(--surface-2);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--next-bg);
      color: var(--next-text);
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tool-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 9px;
      cursor: pointer;
      min-width: 38px;
    }

    .tool-btn:active {
      transform: scale(0.95);
    }

    /* BIG PACING TIMER BANNER (VISIBLE FROM AFAR) */
    .timer-banner {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      background: var(--surface-2);
      color: var(--text);
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .timer-banner.state-green {
      background: var(--state-green-bg);
      color: var(--state-green-fg);
      border-bottom-color: #009624;
    }

    .timer-banner.state-yellow {
      background: var(--state-yellow-bg);
      color: var(--state-yellow-fg);
      border-bottom-color: #c7b000;
    }

    .timer-banner.state-red {
      background: var(--state-red-bg);
      color: var(--state-red-fg);
      border-bottom-color: #b71c1c;
    }

    .timer-main {
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-variant-numeric: tabular-nums;
    }

    .timer-slide-clock {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .timer-slide-target {
      font-size: 17px;
      font-weight: 800;
      opacity: 0.85;
    }

    .timer-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .timer-meta {
      text-align: right;
      line-height: 1.15;
    }

    .timer-status-label {
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .timer-total-line {
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      opacity: 0.88;
    }

    .timer-reset-btn {
      border: 2px solid currentColor;
      background: transparent;
      color: inherit;
      font-size: 16px;
      font-weight: 900;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .timer-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 5px;
      background: rgba(0, 0, 0, 0.35);
      transition: width 0.4s linear;
    }

    .timer-banner.state-red .timer-progress {
      background: rgba(255, 255, 255, 0.5);
    }

    /* SLIDE JUMP STRIP */
    .slide-strip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .slide-pill {
      flex: 1;
      min-width: 40px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
      padding: 6px 4px;
      border-radius: 9px;
      cursor: pointer;
      text-align: center;
    }

    .slide-pill.active {
      border-color: var(--accent);
      background: var(--accent-bg);
      color: var(--text);
    }

    /* MAIN CONTENT */
    .content-wrap {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 16px 20px;
      display: flex;
      flex-direction: column;
    }

    .slide-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }

    .slide-badge {
      font-size: 18px;
      font-weight: 900;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    body.light .slide-badge {
      color: #000;
      background: var(--accent-bg);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .slide-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--muted);
      text-align: right;
    }

    /* KEYWORDS MODE */
    .kw-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .kw-item {
      font-size: var(--kw-size);
      line-height: 1.26;
      font-weight: 700;
      padding: 11px 14px;
      background: var(--surface);
      border-left: 6px solid var(--accent);
      border-radius: 10px;
    }

    .kw-item.warn-item {
      border-left-color: var(--warn);
      background: var(--warn-bg);
    }

    .kw-sub {
      display: block;
      margin-top: 4px;
      font-size: 0.72em;
      font-weight: 600;
      color: var(--muted);
    }

    /* FULL TEXT MODE */
    .full-text {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .full-para {
      margin: 0;
      font-size: var(--full-size);
      line-height: 1.44;
      font-weight: 600;
    }

    .full-para.handoff {
      padding: 12px 14px;
      background: var(--surface);
      border-left: 6px solid var(--cyan);
      border-radius: 10px;
    }

    /* INLINE HIGHLIGHTS */
    .hl {
      color: var(--accent);
      font-weight: 900;
    }

    body.light .hl {
      color: #000000;
      background: var(--accent-bg);
      padding: 0 5px;
      border-radius: 5px;
    }

    .hl-warn {
      color: #ff7a7a;
      font-weight: 900;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    body.light .hl-warn {
      color: var(--warn);
      background: var(--warn-bg);
      padding: 0 5px;
      border-radius: 5px;
      text-decoration: none;
    }

    .pron {
      color: var(--cyan);
      font-weight: 800;
      font-size: 0.82em;
    }

    /* BOTTOM NAV FOR FRIEND */
    .bottombar {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      padding: 8px 12px 10px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      border: none;
      border-radius: 14px;
      font-size: 19px;
      font-weight: 900;
      padding: 14px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.03em;
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-prev {
      flex: 1;
      background: var(--surface-2);
      color: var(--text);
      border: 2px solid var(--border);
    }

    .btn-next {
      flex: 2;
      background: var(--next-bg);
      color: var(--next-text);
    }

    /* LANDSCAPE COMPACT BARS */
    @media (orientation: landscape) and (max-height: 520px) {
      .topbar { padding: 4px 10px; }
      .timer-banner { padding: 5px 12px; }
      .timer-slide-clock { font-size: 26px; }
      .slide-strip { padding: 4px 10px; }
      .slide-pill { padding: 4px; font-size: 13px; }
      .slide-header { margin-bottom: 8px; padding-bottom: 5px; }
      .bottombar { padding: 6px 10px; }
      .nav-btn { padding: 10px 12px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="mode-switch" role="tablist" aria-label="Način prikaza">
        <button class="mode-btn active" id="btnModeKw" onclick="setMode('kw')">KLJUČNE RIJEČI</button>
        <button class="mode-btn" id="btnModeFull" onclick="setMode('full')">CIJELI TEKST</button>
      </div>
      <div class="tools">
        <button class="tool-btn" onclick="changeSize(-3)" aria-label="Smanji font">A−</button>
        <button class="tool-btn" onclick="changeSize(3)" aria-label="Povećaj font">A+</button>
        <button class="tool-btn" id="btnTheme" onclick="toggleTheme()" aria-label="Promijeni temu">☀️</button>
      </div>
    </header>

    <!-- BIG COLOR-CODED TIMER VISIBLE FROM AFAR -->
    <section class="timer-banner" id="timerBanner" onclick="toggleTimer()" title="Dodirni za Start / Pauzu">
      <div class="timer-main">
        <span class="timer-slide-clock" id="slideClock">0:00</span>
        <span class="timer-slide-target" id="slideTarget">/ 0:55</span>
      </div>
      <div class="timer-right">
        <div class="timer-meta">
          <div class="timer-status-label" id="timerStatus">TAP ZA START</div>
          <div class="timer-total-line" id="totalClock">Ukupno 0:00 · Cilj do 0:55</div>
        </div>
        <button class="timer-reset-btn" onclick="event.stopPropagation(); resetTimer();" aria-label="Resetiraj timer">↺</button>
      </div>
      <div class="timer-progress" id="timerProgress" style="width: 0%;"></div>
    </section>

    <nav class="slide-strip" id="slideStrip" aria-label="Odabir slajda"></nav>

    <main class="content-wrap" id="contentWrap">
      <div class="slide-header">
        <div class="slide-badge" id="slideBadge">SLAJD 17</div>
        <div class="slide-title" id="slideTitle">Kućna dostava</div>
      </div>
      <div id="slideBody"></div>
    </main>

    <footer class="bottombar">
      <button class="nav-btn btn-prev" id="btnPrev" onclick="go(-1)">◀ NAZAD</button>
      <button class="nav-btn btn-next" id="btnNext" onclick="go(1)">SLJEDEĆI ▶</button>
    </footer>
  </div>

  <script>
    const SLIDES = [
      {
        num: 17,
        title: "Kućna dostava",
        targetSec: 55,
        idealEnd: "0:55",
        keywords: [
          {
            html: 'tri glavna načina: <span class="hl">kućna dostava</span> · <span class="hl">paketomat</span> · <span class="hl">mjesto preuzimanja</span>'
          },
          {
            html: 'ravno na vrata → 2022., sjeverozapadna Hrvatska → <span class="hl">gotovo 94 %</span> ljudi'
          },
          {
            html: 'pogoditi kad je kupac kod kuće · mjesto za <span class="hl">parkiranje</span>'

          {
            html: 'nema doma → <span class="hl">sortirni centar</span> → sutra opet ide na dostavu → povećava troškove'

        full: [

          'Prvi je dostava na kućnu adresu. Kupcu je to najlakše jer paket stiže ravno na vrata, što potvrđuje i istraživanje iz 2022. u sjeverozapadnoj Hrvatskoj, gdje <span class="hl">gotovo 94 %</span> ljudi bira upravo kućnu dostavu.',
          'Ali za dostavljača to donosi probleme. Teško je pogoditi kad je kupac kod kuće, a u većim gradovima velik je problem i pronaći mjesto za <span class="hl">parkiranje</span>. Ako kupca nema doma, paket se vraća u <span class="hl">sortirni centar</span> i sutra opet ide na dostavu, što povećava troškove.'
        ]
      },
      {

        targetSec: 45,
        idealEnd: "1:40",
        keywords: [
          {
            html: 'ostaviti <span class="hl">više paketa na jednom mjestu</span>'

      {

          },
          {

          {
            html: '<span class="hl">„mrtvi kutovi“</span> → prozirna staklena vrata → <span class="hl">ultrazvučni senzori</span>',

          }
        ],
        full: [
          'Taj problem rješavaju <span class="hl">autonomna dostavna vozila</span> koja voze javnim cestama bez vozača. Spadaju u <span class="hl">SAE Level 4</span> razinu automatizacije.',
          'Najpoznatiji primjer je <span class="hl">Nuro R2</span> – on je dobio <span class="hl-warn">službenu dozvolu</span> za vožnju javnim cestama 2020. godine. Kad kažem 2020. godina, mislim da svi pomislimo na isto – koronavirus. Zašto to spominjem? Nuro R2 je tada imao važnu ulogu: bez kontakta je dostavljao lijekove, hranu i druge stvari unutar <span class="hl-warn">bolničkih ustanova</span> kako bi se smanjilo širenje virusa.'
        ]
      },
      {
        num: 23,
        title: "E-trgovina + Predaja",
        targetSec: 50,
        idealEnd: "6:00",
        keywords: [
          {
            html: 'povezanost e-trgovine i dostavne službe → preko <span class="hl">API-ja</span>',
            sub: 'program pošalje zahtjev drugome i dobije odgovor · svako skeniranje = novi zapis'
          },
          {
            html: 'format <span class="hl">JSON</span> <span class="pron">(DŽEJ-son)</span>'
          },
          {
            html: 'osobni podaci (ime, adresa, telefon) → <span class="hl">TLS 1.3</span> preko <span class="hl">HTTPS-a</span> · smjernice <span class="hl">OWASP-a</span>'
          },
          {
            html: 'PREDAJA: „A što ako paket koji smo dobili nije ono što smo htjeli? Kolega <span class="hl">Filip Zavođa</span>.”'
          }
        ],
        full: [
          'Cijeli ovaj proces oslanja se na povezanost e-trgovine i dostavne službe. Podaci se razmjenjuju preko <span class="hl">API-ja</span> <span class="pron">(Application Programming Interface)</span>, koji omogućuje da jedan program pošalje zahtjev drugome i dobije odgovor. Tijekom prijevoza svako skeniranje stvara novi zapis, pa trgovina preko API-ja povlači i ažurira status dostave.',
          'Podaci se šalju u formatu <span class="hl">JSON</span> <span class="pron">(DŽEJ-son)</span>. Kako se tu prenose osobni podaci kupca – ime, adresa i telefon – važno je da je sav promet zaštićen protokolom <span class="hl">TLS 1.3</span> preko <span class="hl">HTTPS-a</span>, prema smjernicama <span class="hl">OWASP-a</span>.',
          '<strong>PREDAJA:</strong> A što ako paket koji smo dobili nije ono što smo htjeli? Više o tome ispričat će vam kolega <span class="hl">Filip Zavođa</span>.'
        ]
      }
    ];

    let idx = 0;
    let mode = localStorage.getItem('prompter_mode') || 'kw';
    let kwSize = parseInt(localStorage.getItem('prompter_kwSize') || '30', 10);
    let fullSize = parseInt(localStorage.getItem('prompter_fullSize') || '25', 10);
    let isLight = localStorage.getItem('prompter_light') === '1';

    let totalSec = 0;
    let slideSec = 0;
    let timerId = null;

    function fmt(sec) {
      const m = Math.floor(sec / 60);
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function applySizes() {
      document.documentElement.style.setProperty('--kw-size', kwSize + 'px');
      document.documentElement.style.setProperty('--full-size', fullSize + 'px');
    }

    function applyTheme() {
      document.body.classList.toggle('light', isLight);
      document.getElementById('btnTheme').textContent = isLight ? '🌙' : '☀️';
    }

    function toggleTheme() {
      isLight = !isLight;
      localStorage.setItem('prompter_light', isLight ? '1' : '0');
      applyTheme();
    }

    function changeSize(delta) {
      if (mode === 'kw') {
        kwSize = Math.max(18, Math.min(54, kwSize + delta));
        localStorage.setItem('prompter_kwSize', kwSize);
      } else {
        fullSize = Math.max(16, Math.min(44, fullSize + delta));
        localStorage.setItem('prompter_fullSize', fullSize);
      }
      applySizes();
    }

    function setMode(newMode) {
      mode = newMode;
      localStorage.setItem('prompter_mode', mode);
      document.getElementById('btnModeKw').classList.toggle('active', mode === 'kw');
      document.getElementById('btnModeFull').classList.toggle('active', mode === 'full');
      renderSlide();
    }

    function updateTimerUI() {
      const s = SLIDES[idx];
      const banner = document.getElementById('timerBanner');
      const ratio = slideSec / s.targetSec;

      document.getElementById('slideClock').textContent = fmt(slideSec);
      document.getElementById('slideTarget').textContent = `/ ${fmt(s.targetSec)}`;
      document.getElementById('totalClock').textContent = `Ukupno ${fmt(totalSec)} · Cilj do ${s.idealEnd}`;
      document.getElementById('timerProgress').style.width = `${Math.min(100, ratio * 100)}%`;

      banner.classList.remove('state-green', 'state-yellow', 'state-red');
      const statusEl = document.getElementById('timerStatus');

      if (!timerId && totalSec === 0) {
        statusEl.textContent = 'TAP ZA START';
      } else if (!timerId) {
        statusEl.textContent = 'PAUZA (TAP)';
      } else if (ratio < 0.75) {
        banner.classList.add('state-green');
        statusEl.textContent = 'NA VRIJEME';
      } else if (ratio <= 1.05) {
        banner.classList.add('state-yellow');
        statusEl.textContent = 'KRENI DALJE';
      } else {
        banner.classList.add('state-red');
        statusEl.textContent = 'PREDUGO!';
      }
    }

    function toggleTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      } else {
        timerId = setInterval(() => {
          totalSec++;
          slideSec++;
          updateTimerUI();
        }, 1000);
      }
      updateTimerUI();
    }

    function resetTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      totalSec = 0;
      slideSec = 0;
      updateTimerUI();
    }

    function renderStrip() {
      const strip = document.getElementById('slideStrip');
      strip.innerHTML = SLIDES.map((s, i) => `
        <button class="slide-pill ${i === idx ? 'active' : ''}" onclick="jumpTo(${i})">${s.num}</button>
      `).join('');
    }

    function renderSlide() {
      const s = SLIDES[idx];
      document.getElementById('slideBadge').textContent = `SLAJD ${s.num}`;
      document.getElementById('slideTitle').textContent = s.title;

      const body = document.getElementById('slideBody');
      if (mode === 'kw') {
        body.innerHTML = `<ul class="kw-list">${s.keywords.map(k => `
          <li class="kw-item ${k.warn ? 'warn-item' : ''}">
            ${k.html}
            ${k.sub ? `<span class="kw-sub">${k.sub}</span>` : ''}
          </li>
        `).join('')}</ul>`;
      } else {
        body.innerHTML = `<div class="full-text">${s.full.map((p, i) => `
          <p class="full-para ${idx === SLIDES.length - 1 && i === s.full.length - 1 ? 'handoff' : ''}">${p}</p>
        `).join('')}</div>`;
      }

      document.getElementById('btnPrev').disabled = idx === 0;
      const nextBtn = document.getElementById('btnNext');
      if (idx === SLIDES.length - 1) {
        nextBtn.textContent = 'KRAJ (FILIP) ✓';
        nextBtn.disabled = true;
      } else {
        nextBtn.textContent = `SLAJD ${SLIDES[idx + 1].num} ▶`;
        nextBtn.disabled = false;
      }

      document.getElementById('contentWrap').scrollTop = 0;
      renderStrip();
      updateTimerUI();
    }

    function go(delta) {
      const next = idx + delta;
      if (next >= 0 && next < SLIDES.length) {
        idx = next;
        slideSec = 0; // Reset per-slide timer on slide change
        renderSlide();
      }
    }

    function jumpTo(i) {
      if (i !== idx) {
        idx = i;
        slideSec = 0;
        renderSlide();
      }
    }

    // Swipe navigation on content area
    let touchStartX = 0;
    let touchStartY = 0;
    const wrap = document.getElementById('contentWrap');
    wrap.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    wrap.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0) go(1);
        else go(-1);
      }
    }, { passive: true });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        go(1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        go(-1);
      }
    });

    // Keep screen awake during presentation
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (_) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    requestWakeLock();

    // Init
    applySizes();
    applyTheme();
    setMode(mode);
  </script>
</body>
</html>
