<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Podsjetnik za izlaganje – Slajdovi 17–23</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #141418;
      --surface-2: #1f1f27;
      --border: #2e2e3a;
      --text: #ffffff;
      --muted: #b4b4c4;
      --accent: #ffe600;
      --accent-bg: rgba(255, 230, 0, 0.16);
      --warn: #ff5c5c;
      --warn-bg: rgba(255, 92, 92, 0.18);
      --cyan: #5ceeff;
      --next-bg: #ffe600;
      --next-text: #000000;
      --kw-size: 32px;
      --full-size: 26px;
    }

    body.light {
      --bg: #ffffff;
      --surface: #f1f2f6;
      --surface-2: #e2e4ec;
      --border: #c5c8d6;
      --text: #000000;
      --muted: #45485a;
      --accent: #0047ff;
      --accent-bg: #fff275;
      --warn: #c40000;
      --warn-bg: #ffd6d6;
      --cyan: #005b96;
      --next-bg: #000000;
      --next-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* TOP BAR */
    .topbar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .mode-switch {
      display: flex;
      background: var(--surface-2);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 9px;
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    .mode-btn.active {
      background: var(--next-bg);
      color: var(--next-text);
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      padding: 7px 11px;
      border-radius: 10px;
      cursor: pointer;
      min-width: 40px;
    }

    .tool-btn:active {
      transform: scale(0.95);
    }

    .timer-btn {
      font-variant-numeric: tabular-nums;
      min-width: 68px;
    }

    .timer-btn.running {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* SLIDE JUMP STRIP */
    .slide-strip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .slide-pill {
      flex: 1;
      min-width: 42px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 16px;
      font-weight: 800;
      padding: 7px 4px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
    }

    .slide-pill.active {
      border-color: var(--accent);
      background: var(--accent-bg);
      color: var(--text);
    }

    /* MAIN CONTENT */
    .content-wrap {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 18px 24px;
      display: flex;
      flex-direction: column;
    }

    .slide-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    .slide-badge {
      font-size: 18px;
      font-weight: 900;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    body.light .slide-badge {
      color: #000;
      background: var(--accent-bg);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .slide-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--muted);
      text-align: right;
    }

    /* KEYWORDS MODE */
    .kw-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .kw-item {
      font-size: var(--kw-size);
      line-height: 1.28;
      font-weight: 700;
      padding: 12px 14px;
      background: var(--surface);
      border-left: 6px solid var(--accent);
      border-radius: 10px;
    }

    .kw-item.warn-item {
      border-left-color: var(--warn);
      background: var(--warn-bg);
    }

    .kw-sub {
      display: block;
      margin-top: 4px;
      font-size: 0.72em;
      font-weight: 600;
      color: var(--muted);
    }

    /* FULL TEXT MODE */
    .full-text {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .full-para {
      margin: 0;
      font-size: var(--full-size);
      line-height: 1.45;
      font-weight: 600;
      letter-spacing: 0.005em;
    }

    .full-para.handoff {
      padding: 14px 16px;
      background: var(--surface);
      border-left: 6px solid var(--cyan);
      border-radius: 10px;
    }

    /* INLINE HIGHLIGHTS */
    .hl {
      color: var(--accent);
      font-weight: 900;
    }

    body.light .hl {
      color: #000000;
      background: var(--accent-bg);
      padding: 0 5px;
      border-radius: 5px;
    }

    .hl-warn {
      color: #ff7a7a;
      font-weight: 900;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    body.light .hl-warn {
      color: var(--warn);
      background: var(--warn-bg);
      padding: 0 5px;
      border-radius: 5px;
      text-decoration: none;
    }

    .pron {
      color: var(--cyan);
      font-weight: 800;
      font-size: 0.82em;
    }

    /* BOTTOM NAV FOR FRIEND */
    .bottombar {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      padding: 10px 12px 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      border: none;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 900;
      padding: 16px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.03em;
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-prev {
      flex: 1;
      background: var(--surface-2);
      color: var(--text);
      border: 2px solid var(--border);
    }

    .btn-next {
      flex: 2;
      background: var(--next-bg);
      color: var(--next-text);
    }

    /* LANDSCAPE COMPACT BARS SO TEXT GETS MAX SPACE */
    @media (orientation: landscape) and (max-height: 520px) {
      .topbar {
        padding: 5px 10px;
      }
      .slide-strip {
        padding: 4px 10px;
      }
      .slide-pill {
        padding: 4px;
        font-size: 14px;
      }
      .slide-header {
        margin-bottom: 8px;
        padding-bottom: 6px;
      }
      .bottombar {
        padding: 6px 10px;
      }
      .nav-btn {
        padding: 10px 14px;
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="mode-switch" role="tablist" aria-label="Način prikaza">
        <button class="mode-btn active" id="btnModeKw" onclick="setMode('kw')">KLJUČNE RIJEČI</button>
        <button class="mode-btn" id="btnModeFull" onclick="setMode('full')">CIJELI TEKST</button>
      </div>
      <div class="tools">
        <button class="tool-btn" onclick="changeSize(-3)" aria-label="Smanji font">A−</button>
        <button class="tool-btn" onclick="changeSize(3)" aria-label="Povećaj font">A+</button>
        <button class="tool-btn" id="btnTheme" onclick="toggleTheme()" aria-label="Promijeni temu">☀️</button>
        <button class="tool-btn timer-btn" id="btnTimer" onclick="toggleTimer()" ondblclick="resetTimer()" title="Klik: start/pauza, dupli klik: reset">00:00</button>
      </div>
    </header>

    <nav class="slide-strip" id="slideStrip" aria-label="Odabir slajda"></nav>

    <main class="content-wrap" id="contentWrap">
      <div class="slide-header">
        <div class="slide-badge" id="slideBadge">SLAJD 17</div>
        <div class="slide-title" id="slideTitle">Kućna dostava</div>
      </div>
      <div id="slideBody"></div>
    </main>

    <footer class="bottombar">
      <button class="nav-btn btn-prev" id="btnPrev" onclick="go(-1)">◀ NAZAD</button>
      <button class="nav-btn btn-next" id="btnNext" onclick="go(1)">SLJEDEĆI ▶</button>
    </footer>
  </div>

  <script>

        keywords: [

      }
    ];

    let idx = 0;
    let mode = localStorage.getItem('prompter_mode') || 'kw';
    let kwSize = parseInt(localStorage.getItem('prompter_kwSize') || '32', 10);
    let fullSize = parseInt(localStorage.getItem('prompter_fullSize') || '26', 10);
    let isLight = localStorage.getItem('prompter_light') === '1';

    let seconds = 0;
    let timerId = null;

    function applySizes() {
      document.documentElement.style.setProperty('--kw-size', kwSize + 'px');
      document.documentElement.style.setProperty('--full-size', fullSize + 'px');
    }

    function applyTheme() {
      document.body.classList.toggle('light', isLight);
      document.getElementById('btnTheme').textContent = isLight ? '🌙' : '☀️';
    }

    function toggleTheme() {
      isLight = !isLight;
      localStorage.setItem('prompter_light', isLight ? '1' : '0');
      applyTheme();
    }

    function changeSize(delta) {
      if (mode === 'kw') {
        kwSize = Math.max(18, Math.min(56, kwSize + delta));
        localStorage.setItem('prompter_kwSize', kwSize);
      } else {
        fullSize = Math.max(16, Math.min(46, fullSize + delta));
        localStorage.setItem('prompter_fullSize', fullSize);
      }
      applySizes();
    }

    function setMode(newMode) {
      mode = newMode;
      localStorage.setItem('prompter_mode', mode);
      document.getElementById('btnModeKw').classList.toggle('active', mode === 'kw');
      document.getElementById('btnModeFull').classList.toggle('active', mode === 'full');
      renderSlide();
    }

    function renderStrip() {
      const strip = document.getElementById('slideStrip');
      strip.innerHTML = SLIDES.map((s, i) => `
        <button class="slide-pill ${i === idx ? 'active' : ''}" onclick="jumpTo(${i})">${s.num}</button>
      `).join('');
    }

    function renderSlide() {
      const s = SLIDES[idx];
      document.getElementById('slideBadge').textContent = `SLAJD ${s.num}`;
      document.getElementById('slideTitle').textContent = s.title;

      const body = document.getElementById('slideBody');
      if (mode === 'kw') {
        body.innerHTML = `<ul class="kw-list">${s.keywords.map(k => `
          <li class="kw-item ${k.warn ? 'warn-item' : ''}">
            ${k.html}
            ${k.sub ? `<span class="kw-sub">${k.sub}</span>` : ''}
          </li>
        `).join('')}</ul>`;
      } else {
        body.innerHTML = `<div class="full-text">${s.full.map((p, i) => `
          <p class="full-para ${idx === SLIDES.length - 1 && i === s.full.length - 1 ? 'handoff' : ''}">${p}</p>
        `).join('')}</div>`;
      }

      document.getElementById('btnPrev').disabled = idx === 0;
      const nextBtn = document.getElementById('btnNext');
      if (idx === SLIDES.length - 1) {
        nextBtn.textContent = 'KRAJ (FILIP) ✓';
        nextBtn.disabled = true;
      } else {
        nextBtn.textContent = `SLAJD ${SLIDES[idx + 1].num} ▶`;
        nextBtn.disabled = false;
      }

      document.getElementById('contentWrap').scrollTop = 0;
      renderStrip();
    }

    function go(delta) {
      const next = idx + delta;
      if (next >= 0 && next < SLIDES.length) {
        idx = next;
        renderSlide();
      }
    }

    function jumpTo(i) {
      idx = i;
      renderSlide();
    }

    // Timer
    function updateTimerDisplay() {
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      document.getElementById('btnTimer').textContent = `${m}:${s}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('btnTimer');
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        btn.classList.remove('running');
      } else {
        timerId = setInterval(() => {
          seconds++;
          updateTimerDisplay();
        }, 1000);
        btn.classList.add('running');
      }
    }

    function resetTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      seconds = 0;
      document.getElementById('btnTimer').classList.remove('running');
      updateTimerDisplay();
    }

    // Swipe navigation on content area
    let touchStartX = 0;
    let touchStartY = 0;
    const wrap = document.getElementById('contentWrap');
    wrap.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    wrap.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0) go(1);
        else go(-1);
      }
    }, { passive: true });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        go(1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        go(-1);
      }
    });

    // Keep screen awake during presentation (supported in modern Safari/Chrome)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (_) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    requestWakeLock();

    // Init
    applySizes();
    applyTheme();
    setMode(mode);
  </script>
</body>
</html>
